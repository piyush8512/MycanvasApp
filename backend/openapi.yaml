        - $ref: "#/components/parameters/CollaboratorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCollaboratorRoleRequest"
      responses:
        "200":
          description: Collaborator role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"

    delete:
      tags: [Sharing]
      summary: Remove file/canvas collaborator
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/CollaboratorId"
      responses:
        "200":
          description: Collaborator removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"

  /api/sharing/file/link/{shareToken}:
    get:
      tags: [Sharing]
      summary: Access shared file/canvas via token
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          description: Shared file fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericDataResponse"
        "404":
          description: Shared file not found/expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/sharing/shared-with-me:
    get:
      tags: [Sharing]
      summary: List items shared with current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Shared items fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericDataResponse"

  /api/sharing/revoke/{itemType}/{itemId}/link:
    delete:
      tags: [Sharing]
      summary: Revoke share link
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemType"
        - $ref: "#/components/parameters/ItemIdGeneric"
      responses:
        "200":
          description: Share link revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"

  /api/layouts/canvas:
    get:
      tags: [Layouts]
      summary: Get all canvas layouts for current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Canvas layouts fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericDataResponse"

  /api/layouts/canvas/bulk:
    put:
      tags: [Layouts]
      summary: Bulk update canvas layouts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkLayoutUpdateRequest"
      responses:
        "200":
          description: Canvas layouts updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"

  /api/layouts/canvas/{fileId}:
    put:
      tags: [Layouts]
      summary: Update single canvas layout
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SingleLayoutUpdateRequest"
      responses:
        "200":
          description: Canvas layout updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"

    delete:
      tags: [Layouts]
      summary: Delete/reset single canvas layout
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Canvas layout deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"

  /api/layouts/folder:
    get:
      tags: [Layouts]
      summary: Get all folder layouts for current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Folder layouts fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericDataResponse"

  /api/layouts/folder/bulk:
    put:
      tags: [Layouts]
      summary: Bulk update folder layouts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkLayoutUpdateRequest"
      responses:
        "200":
          description: Folder layouts updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"

  /api/layouts/folder/{folderId}:
    put:
      tags: [Layouts]
      summary: Update single folder layout
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FolderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SingleLayoutUpdateRequest"
      responses:
        "200":
          description: Folder layout updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CanvasId:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: Canvas ID
    CanvasIdInItemsRoute:
      in: path
      name: canvasId
      required: true
      schema:
        type: string
      description: Canvas ID
    FolderId:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: Folder ID
    FileId:
      in: path
      name: fileId
      required: true
      schema:
        type: string
      description: File/Canvas ID
    FriendId:
      in: path
      name: friendId
      required: true
      schema:
        type: string
      description: Friend user ID
    FriendRequestId:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: Friend request ID
    ItemId:
      in: path
      name: itemId
      required: true
      schema:
        type: string
      description: Canvas item ID
    ItemIdGeneric:
      in: path
      name: itemId
      required: true
      schema:
        type: string
      description: Shared item ID
    ItemType:
      in: path
      name: itemType
      required: true
      schema:
        type: string
        enum: [folder, file]
      description: Shared item type
    CollaboratorId:
      in: path
      name: collaboratorId
      required: true
      schema:
        type: string
      description: Collaborator user ID
    ShareToken:
      in: path
      name: shareToken
      required: true
      schema:
        type: string
      description: Public share token

  schemas:
    RootHealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Canvas API is running on Vercel!
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Request failed
        error:
          type: string
          nullable: true
          example: Internal Server Error

    SuccessMessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully

    GenericDataResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          nullable: true
          example: Data fetched successfully
        data:
          type: object
          additionalProperties: true
          nullable: true

    UserProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User fetched successfully
        user:
          type: object
          additionalProperties: true

    Folder:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        ownerId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        positionX:
          type: number
          nullable: true
        positionY:
          type: number
          nullable: true

    FolderListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Folders fetched successfully
        folders:
          type: array
          items:
            $ref: "#/components/schemas/Folder"

    FolderSingleResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Folder fetched successfully
        folder:
          $ref: "#/components/schemas/Folder"

    Canvas:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        size:
          type: integer
          example: 0
        url:
          type: string
          example: /canvas/abc123
        folderId:
          type: string
          nullable: true
        ownerId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        positionX:
          type: number
          nullable: true
          example: 120
        positionY:
          type: number
          nullable: true
          example: 80

    CanvasItem:
      type: object
      properties:
        id:
          type: string
        canvasId:
          type: string
        createdBy:
          type: string
        type:
          type: string
          example: note
        name:
          type: string
          nullable: true
          example: Quick note
        color:
          type: string
          nullable: true
          example: "#FECACA"
        position:
          $ref: "#/components/schemas/XYPosition"
        size:
          $ref: "#/components/schemas/Size"
        content:
          type: object
          additionalProperties: true
          nullable: true
          example:
            text: hello world
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    XYPosition:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          example: 120
        y:
          type: number
          example: 80

    Size:
      type: object
      required: [width, height]
      properties:
        width:
          type: number
          example: 320
        height:
          type: number
          example: 220

    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: Product Docs
        position:
          $ref: "#/components/schemas/XYPosition"

    UpdateFolderRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          example: Updated Folder Name
        position:
          $ref: "#/components/schemas/XYPosition"

    CreateCanvasRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: Feature Board
        folderId:
          type: string
          nullable: true
          example: folder_123

    UpdateCanvasRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          example: Renamed Canvas
        position:
          $ref: "#/components/schemas/XYPosition"

    CreateCanvasItemRequest:
      type: object
      required: [type, position, size]
      properties:
        type:
          type: string
          example: youtube
        name:
          type: string
          nullable: true
          example: Demo video
        color:
          type: string
          nullable: true
          example: "#DBEAFE"
        position:
          $ref: "#/components/schemas/XYPosition"
        size:
          $ref: "#/components/schemas/Size"
        content:
          type: object
          additionalProperties: true
          nullable: true
          example:
            url: https://youtu.be/dQw4w9WgXcQ
            videoId: dQw4w9WgXcQ

    UpdateCanvasItemRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
        position:
          $ref: "#/components/schemas/XYPosition"
        size:
          $ref: "#/components/schemas/Size"
        content:
          type: object
          additionalProperties: true

    SignedUrlRequest:
      type: object
      required: [fileName, contentType]
      properties:
        fileName:
          type: string
          example: screenshot-123.png
        contentType:
          type: string
          example: image/png

    PublicUrlRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          example: uploads/user123/screenshot-123.png

    DeleteFileRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          example: uploads/user123/screenshot-123.png

    SendFriendRequestBody:
      type: object
      required: [friendCode]
      properties:
        friendCode:
          type: string
          example: "@sarah#4242"
        message:
          type: string
          nullable: true
          example: Hi, let's collaborate!

    UpdatePublicRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          example: VIEWER

    AddCollaboratorsRequest:
      type: object
      properties:
        collaborators:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
              role:
                type: string
                example: EDITOR

    UpdateCollaboratorRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          example: EDITOR

    BulkLayoutUpdateRequest:
      type: object
      properties:
        layouts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              position:
                $ref: "#/components/schemas/XYPosition"

    SingleLayoutUpdateRequest:
      type: object
      required: [position]
      properties:
        position:
          $ref: "#/components/schemas/XYPosition"

    CanvasListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Canvas fetched successfully
        canvas:
          type: array
          items:
            $ref: "#/components/schemas/Canvas"

    CanvasSingleResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Canvas details fetched successfully
        canvas:
          $ref: "#/components/schemas/Canvas"

    CanvasItemsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/CanvasItem"
        pagination:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
            hasMore:
              type: boolean
            nextOffset:
              type: integer
              nullable: true

    CanvasItemSingleResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Item created successfully
        item:
          $ref: "#/components/schemas/CanvasItem"
